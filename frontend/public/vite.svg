<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#grad)"/>
  <g transform="translate(16, 16)">
    <!-- Solar Panel Grid -->
    <rect x="0" y="0" width="32" height="32" rx="2" fill="white" opacity="0.9"/>
    <rect x="4" y="4" width="10" height="10" rx="1" fill="#16a34a"/>
    <rect x="18" y="4" width="10" height="10" rx="1" fill="#16a34a"/>
    <rect x="4" y="18" width="10" height="10" rx="1" fill="#16a34a"/>
    <rect x="18" y="18" width="10" height="10" rx="1" fill="#16a34a"/>
    <!-- Sun rays -->
    <line x1="16" y1="0" x2="16" y2="-8" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="2" x2="28" y2="-4" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="2" x2="4" y2="-4" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>

